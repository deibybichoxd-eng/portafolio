<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Camargo Freelancer | Portafolio de Marketing & Diseño</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #050505;
            --surface-dark: #0f0f11;
            --card-bg: #141416;
            --border-color: #27272a;
            --text-white: #ffffff;
            --text-muted: #a1a1aa;
            --text-dark: #09090b;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', 'Montserrat', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-black);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        /* HEADER / NAVBAR */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-white);
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--text-white);
            border-radius: 50%;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--text-white);
        }

        .nav-btn {
            padding: 10px 22px;
            background: transparent;
            color: var(--text-white);
            border: 1px solid var(--text-white);
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: var(--text-white);
            color: var(--text-dark);
        }

        /* HERO SECTION */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 8% 80px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-white);
            margin-bottom: 25px;
        }

        .badge-pill i {
            font-size: 0.7rem;
            color: #22c55e;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            max-width: 900px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: transparent;
            -webkit-text-stroke: 1px #ffffff;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 750px;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.8;
        }

        .cta-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            padding: 18px 40px;
            background: var(--text-white);
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: var(--transition);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            background: #e4e4e7;
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.35);
        }

        .btn-secondary {
            padding: 18px 40px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary:hover {
            border-color: var(--text-white);
            background: rgba(255, 255, 255, 0.1);
        }

        /* METRICS BAR */
        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px 8%;
            background: var(--surface-dark);
            border-y: 1px solid var(--border-color);
            margin-bottom: 60px;
        }

        .metric-item {
            text-align: center;
            padding: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-item:last-child {
            border-right: none;
        }

        .metric-number {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-white);
            line-height: 1;
            margin-bottom: 8px;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* SECTIONS COMMON */
        section {
            padding: 100px 8%;
        }

        .section-header {
            margin-bottom: 60px;
            text-align: left;
        }

        .section-subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: block;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        /* SERVICES / CAPABILITIES */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 30px;
            transition: var(--transition);
        }

        .service-card:hover {
            border-color: var(--text-white);
            transform: translateY(-6px);
            background: #18181b;
        }

        .service-icon {
            font-size: 2rem;
            color: var(--text-white);
            margin-bottom: 20px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .service-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .service-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* YOUTUBE SECTION GRID */
        .
